services:
  bedwetter:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: bedwetter
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./bedwetter.db:/app/bedwetter.db
    environment: {}  # Timezone is set via config.yaml `timezone:` field (defaults to UTC)
